name: Rakit publish Docker image to GHCR

on:
  release:
    types: [published]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-scan-push:
    if: github.event.release.target_commitish == 'main' || github.event.release.target_commitish == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine build metadata
        id: vars
        env:
          RELEASE_BRANCH: ${{ github.event.release.target_commitish }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${RELEASE_BRANCH}" == "dev" ]]; then
            CHANNEL="dev"
            ALIAS="dev_latest"
          else
            CHANNEL="main"
            ALIAS="latest"
          fi
          {
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${ALIAS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Compose configuration
        env:
          APP_PIN: "246810"
          APP_ENC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f local-build-docker-compose.yml config --quiet

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Test backend and build frontend
        run: |
          npm test --prefix backend
          npm run build --prefix frontend

      - name: Audit npm dependencies
        run: |
          npm audit --prefix backend --omit=dev --audit-level=high
          npm audit --prefix frontend --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for security checks
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          pull: true
          provenance: false
          tags: rakit-security-scan:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            APP_REPO=${{ github.repository }}
            APP_CHANNEL=${{ steps.vars.outputs.channel }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify hardened runtime and authenticated API
        env:
          TEST_IMAGE: rakit-security-scan:${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "${TEST_IMAGE}")" = "node"
          docker run --rm --entrypoint node "${TEST_IMAGE}" -e \
            "const fs=require('node:fs'); fs.accessSync('/app',fs.constants.R_OK); try{fs.accessSync('/app',fs.constants.W_OK); process.exit(1)}catch{}"
          docker run -d --rm --name rakit-security-smoke \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18011:8011 \
            -e APP_PIN=246810 \
            -e APP_ENC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "${TEST_IMAGE}"
          trap 'docker stop rakit-security-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18011/health >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18011/api/cabinets)" = "401"
          curl --fail --silent --cookie-jar /tmp/rakit-cookie \
            --header 'Content-Type: application/json' \
            --data '{"pin":"246810"}' \
            http://127.0.0.1:18011/api/pin/verify >/dev/null
          curl --fail --silent --cookie /tmp/rakit-cookie http://127.0.0.1:18011/api/cabinets >/dev/null

      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rakit-security-scan:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image with SBOM and provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            APP_REPO=${{ github.repository }}
            APP_CHANNEL=${{ steps.vars.outputs.channel }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
