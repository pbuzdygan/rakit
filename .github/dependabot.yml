version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-patches:
        update-types: [patch, minor]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-patches:
        update-types: [patch, minor]
    ignore:
      # Tailwind 4 changes the PostCSS integration and requires a dedicated
      # migration. Keep receiving fixes from the supported 3.x line without
      # opening an automatically unbuildable major-version PR.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
