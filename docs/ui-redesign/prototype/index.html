<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Rakit Operations Console — interactive prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
      <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></symbol>
      <symbol id="i-rack" viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19"/><path d="M8 6h8M8 10h8M8 14h8M8 18h8"/><circle cx="6.5" cy="6" r=".5"/><circle cx="6.5" cy="18" r=".5"/></symbol>
      <symbol id="i-network" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M12 7.5v4M5 15.5v-4h14v4"/></symbol>
      <symbol id="i-ports" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6"/><rect x="3" y="14" width="18" height="6"/><path d="M7 7h2M12 7h2M17 7h1M7 17h2M12 17h2M17 17h1"/></symbol>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v9M6.1 5.8a9 9 0 1 0 11.8 0"/></symbol>
      <symbol id="i-audit" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 7H3s3 0 3-7ZM10 20h4"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 9A7 7 0 0 1 18.8 7.5L20 11M4 13l1.2 3.5A7 7 0 0 0 17.9 15"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8Z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6M7.5 17.5l-1 1a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0M16.5 6.5l1-1a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l3.5-.7L20 6.8 17.2 4 4.7 16.5Z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
      <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7"/><rect x="3" y="14" width="18" height="7"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h7M11 17.5h7"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v8h14v-8"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    </svg>

    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-block">
          <div class="brand-mark">R</div>
          <div class="brand-copy"><strong>RAKIT</strong><span>Operations Console</span></div>
        </div>

        <nav class="primary-nav" aria-label="Główne moduły">
          <button class="nav-item" data-view="overview"><svg><use href="#i-overview" /></svg><span>Overview</span></button>
          <button class="nav-item is-active" data-view="racks"><svg><use href="#i-rack" /></svg><span>Racks</span></button>
          <button class="nav-item" data-view="ip"><svg><use href="#i-network" /></svg><span>IP Addressing</span></button>
          <button class="nav-item" data-view="ports"><svg><use href="#i-ports" /></svg><span>Port Map</span></button>
          <button class="nav-item" data-view="wol"><svg><use href="#i-power" /></svg><span>Wake on LAN</span></button>
          <button class="nav-item" data-view="audit"><svg><use href="#i-audit" /></svg><span>Audit Log</span></button>
        </nav>

        <div class="sidebar-footer">
          <button class="nav-item" id="settingsButton"><svg><use href="#i-settings" /></svg><span>Settings</span></button>
          <div class="user-card">
            <div class="avatar">AD</div>
            <div class="user-copy"><strong>admin</strong><span>Administrator</span></div>
          </div>
          <button class="collapse-sidebar" id="collapseSidebar" aria-label="Zwiń menu" title="Zwiń menu">
            <svg><use href="#i-chevron" /></svg><span>Zwiń menu</span>
          </button>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Otwórz menu"><svg><use href="#i-menu" /></svg></button>
          <div class="breadcrumbs" id="breadcrumbs"><span>Infrastructure</span><b>/</b><span>Warsaw HQ</span><b>/</b><strong>EDGE-A</strong></div>
          <label class="global-search">
            <svg><use href="#i-search" /></svg>
            <input id="globalSearch" type="search" placeholder="Search assets, IPs, MACs…" aria-label="Wyszukiwanie globalne" />
            <kbd>/</kbd>
          </label>
          <div class="integration-status"><i></i><span id="integrationLabel">UniFi Connected</span></div>
          <button class="icon-button" aria-label="Powiadomienia"><svg><use href="#i-bell" /></svg><span class="notification-dot"></span></button>
          <button class="icon-button" id="lockButton" aria-label="Zablokuj sesję"><svg><use href="#i-lock" /></svg></button>
        </header>

        <main class="view-root" id="viewRoot" tabindex="-1"></main>
      </section>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <div class="modal-backdrop" id="modalBackdrop" hidden></div>

    <script src="./app.js"></script>
  </body>
</html>
